name: Publicar GameZone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar GameZone
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q GameZone-GitHub-Pages-Slim.zip -d _site
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Crear artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
